<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex; height: 100vh;
      justify-content: center; align-items: center;
      background: #f5f5f5; margin: 0;
    }
    .box {
      background: #fff; padding: 20px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 280px;
    }
    input, button {
      width: 100%; padding: 10px; margin: 6px 0;
      border: 1px solid #ccc; border-radius: 6px;
    }
    button { background: #007bff; color: #fff; border: none; cursor: pointer; }
    button:hover { background: #0056b3; }
    #result { margin-top: 10px; font-size: 14px; white-space: pre-line; }
    .strong { color: green; } .weak { color: red; }
  </style>
</head>
<body>
  <div class="box">
    <h3>Password Checker</h3>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="check()">Check</button>
    <div id="result"></div>
  </div>

  <script>
    function check() {
      const p = document.getElementById("password").value;
      const res = document.getElementById("result");
      let f = [];
      if (p.length < 8) f.push("8+ chars");
      if (!/[A-Z]/.test(p)) f.push("uppercase");
      if (!/[a-z]/.test(p)) f.push("lowercase");
      if (!/\d/.test(p)) f.push("digit");
      if (!/[\W_]/.test(p)) f.push("special");
      res.className = f.length ? "weak" : "strong";
      res.textContent = f.length ? "Weak: missing " + f.join(", ") : "Strong!";
    }
  </script>
</body>
</html>
